<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paycheck Allocator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #4caf50; /* Green for money */
            --danger: #ff5252;
            --accent: #2196f3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1, h2 { margin-bottom: 10px; }

        /* Summary Header */
        .summary-card {
            background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .total-label { font-size: 0.9em; color: var(--text-muted); }
        .total-amount { font-size: 2em; font-weight: bold; color: var(--primary); }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.1s;
        }
        
        button:active { transform: scale(0.98); }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }

        /* Inputs */
        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: white;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Bill List */
        .bill-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .bill-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--danger); /* Red default for unpaid */
            position: relative;
        }

        .bill-card.fully-funded {
            border-left-color: var(--primary);
        }

        .bill-info h3 { margin: 0 0 5px 0; }
        .bill-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
        
        .bill-stats {
            text-align: right;
        }

        .progress-bar-bg {
            width: 100px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="summary-card">
        <div>
            <div class="total-label">Total Allocated Cash</div>
            <div class="total-amount">$<span id="totalWallet">0.00</span></div>
        </div>
        <button class="btn-primary" onclick="openPaycheckModal()">+ Input Paycheck</button>
    </div>

    <div class="actions">
        <button class="btn-accent" onclick="openAddBillModal()">Add New Bill</button>
    </div>

    <h2>Upcoming Bills</h2>
    <div id="billList" class="bill-grid">
        <div style="text-align:center; color:#666; margin-top:20px;">Loading bills...</div>
    </div>
</div>

<div id="billModal" class="modal">
    <div class="modal-content">
        <h3>Add New Bill</h3>
        <label>Bill Name</label>
        <input type="text" id="billName" placeholder="e.g. Electric">
        <label>Total Amount Due</label>
        <input type="number" id="billAmount" placeholder="0.00">
        <label>Due Date</label>
        <input type="date" id="billDate">
        <div class="modal-buttons">
            <button onclick="closeModal('billModal')">Cancel</button>
            <button class="btn-accent" onclick="saveBill()">Save Bill</button>
        </div>
    </div>
</div>

<div id="paycheckModal" class="modal">
    <div class="modal-content">
        <h3>Distribute Paycheck</h3>
        <p style="color:#aaa; font-size:0.9rem;">Enter your paycheck amount. We will help you add funds to your bills.</p>
        <label>Paycheck Amount</label>
        <input type="number" id="paycheckAmount" placeholder="0.00">
        
        <div id="allocationList" style="max-height: 200px; overflow-y: auto; margin-top:10px;">
            </div>

        <div class="modal-buttons">
            <button onclick="closeModal('paycheckModal')">Cancel</button>
            <button class="btn-primary" onclick="processPaycheck()">Distribute</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBalSGWdrzYB0XH8cw-tcEqT_7uUssjAtY",
        authDomain: "studio-4711143268-e528e.firebaseapp.com",
        projectId: "studio-4711143268-e528e",
        storageBucket: "studio-4711143268-e528e.firebasestorage.app",
        messagingSenderId: "987198081063",
        appId: "1:987198081063:web:25138486f6512d022d6602"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const billsCol = collection(db, "user_bills");

    // Global State
    let bills = [];

    // --- REALTIME LISTENER ---
    const q = query(billsCol, orderBy("dueDate", "asc"));
    onSnapshot(q, (snapshot) => {
        bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderBills();
        updateTotalWallet();
    });

    // --- RENDER FUNCTIONS ---
    function renderBills() {
        const container = document.getElementById('billList');
        container.innerHTML = "";

        if(bills.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#555;'>No bills tracked yet.</p>";
            return;
        }

        bills.forEach(bill => {
            const allocated = bill.allocated || 0;
            const percentage = Math.min(100, (allocated / bill.amount) * 100);
            const isFunded = allocated >= bill.amount;
            
            const div = document.createElement('div');
            div.className = `bill-card ${isFunded ? 'fully-funded' : ''}`;
            div.innerHTML = `
                <div class="bill-info">
                    <h3>${bill.name}</h3>
                    <p>Due: ${bill.dueDate}</p>
                </div>
                <div class="bill-stats">
                    <div style="font-weight:bold; color: ${isFunded ? 'var(--primary)' : 'white'}">
                        $${allocated.toFixed(2)} / $${Number(bill.amount).toFixed(2)}
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div style="margin-top:5px;">
                         <button style="font-size:0.7rem; padding:4px 8px; background:#333; color:#fff;" onclick="window.deleteBill('${bill.id}')">Delete</button>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function updateTotalWallet() {
        const total = bills.reduce((sum, bill) => sum + (bill.allocated || 0), 0);
        document.getElementById('totalWallet').innerText = total.toFixed(2);
    }

    // --- BILL ACTIONS ---
    window.saveBill = async () => {
        const name = document.getElementById('billName').value;
        const amount = parseFloat(document.getElementById('billAmount').value);
        const date = document.getElementById('billDate').value;

        if(!name || !amount || !date) return alert("Please fill all fields");

        try {
            await addDoc(billsCol, {
                name: name,
                amount: amount,
                dueDate: date,
                allocated: 0 // Starts with 0 saved
            });
            closeModal('billModal');
            document.getElementById('billName').value = '';
            document.getElementById('billAmount').value = '';
        } catch(e) {
            console.error(e);
            alert("Error saving bill");
        }
    }

    window.deleteBill = async (id) => {
        if(confirm("Remove this bill?")) {
            await deleteDoc(doc(db, "user_bills", id));
        }
    }

    // --- PAYCHECK ALLOCATION LOGIC ---
    window.processPaycheck = async () => {
        const paycheckInput = document.getElementById('paycheckAmount');
        let remainingPaycheck = parseFloat(paycheckInput.value);
        
        if(!remainingPaycheck || remainingPaycheck <= 0) return alert("Enter valid amount");

        // Simple algorithm: You can expand this. 
        // Currently, it just manually asks the user. 
        // Logic: Iterate through inputs generated in the modal
        
        const inputs = document.querySelectorAll('.allocation-input');
        const batchUpdates = [];

        for (let input of inputs) {
            const addAmount = parseFloat(input.value) || 0;
            const billId = input.dataset.id;
            const currentAllocated = parseFloat(input.dataset.current);
            
            if (addAmount > 0) {
                const billRef = doc(db, "user_bills", billId);
                // We perform the update immediately (optimistic)
                await updateDoc(billRef, {
                    allocated: currentAllocated + addAmount
                });
                remainingPaycheck -= addAmount;
            }
        }

        paycheckInput.value = '';
        closeModal('paycheckModal');
    }

    // --- MODAL HANDLING ---
    window.openAddBillModal = () => {
        document.getElementById('billModal').style.display = 'flex';
    }

    window.openPaycheckModal = () => {
        const list = document.getElementById('allocationList');
        list.innerHTML = '';
        
        // Sort bills: closest due date first
        const sortedBills = [...bills].sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

        sortedBills.forEach(bill => {
            const remaining = bill.amount - (bill.allocated || 0);
            if(remaining <= 0) return; // Skip fully paid bills

            const div = document.createElement('div');
            div.style.marginBottom = "10px";
            div.style.padding = "10px";
            div.style.background = "#222";
            div.style.borderRadius = "5px";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>${bill.name}</span>
                    <span style="color:var(--danger); font-size:0.8em;">Needs $${remaining.toFixed(2)}</span>
                </div>
                <input type="number" 
                       class="allocation-input" 
                       data-id="${bill.id}" 
                       data-current="${bill.allocated || 0}"
                       placeholder="Add amount..." 
                       style="margin:0; font-size:0.9em;">
            `;
            list.appendChild(div);
        });

        document.getElementById('paycheckModal').style.display = 'flex';
    }

    window.closeModal = (id) => {
        document.getElementById(id).style.display = 'none';
    }
    
    // Close modal on outside click
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
