<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Allocator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide { display: none !important; }
        .progress-bar-bg { background-color: #e2e8f0; }
        .dark .progress-bar-bg { background-color: #374151; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="bg-indigo-500 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-chart-line text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Micro-Allocator</h1>
                <p class="text-slate-400">Waterfall budgeting for irregular income.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="auth-error" class="hide bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg text-center"></div>
                
                <div>
                    <label class="block text-slate-400 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="you@example.com">
                </div>
                
                <div>
                    <label class="block text-slate-400 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="toggle-auth-mode" class="text-slate-400 hover:text-white text-sm transition-colors">
                    Need an account? <span class="text-indigo-400 font-bold">Create one</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hide pb-20">
        
        <!-- HEADER -->
        <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-10">
            <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-droplet text-blue-500"></i>
                        Waterfall
                    </h1>
                    <p id="user-id-display" class="text-xs text-slate-500 dark:text-slate-400">ID: ...</p>
                </div>
                <button id="logout-btn" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-6">

            <!-- DASHBOARD CARD -->
            <div class="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-2xl p-6 text-white shadow-lg">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-indigo-200 text-sm font-medium">General Reserve</p>
                        <h2 id="reserve-display" class="text-3xl font-bold">$0.00</h2>
                    </div>
                    <i class="fa-solid fa-shield-halved text-indigo-200 opacity-50 text-3xl"></i>
                </div>
                
                <div class="bg-white/10 rounded-xl p-3 backdrop-blur-sm">
                    <div class="flex justify-between text-xs text-indigo-100 mb-1">
                        <span>Monthly Progress</span>
                        <span id="progress-text">0% Funded</span>
                    </div>
                    <div class="h-2 w-full bg-indigo-900/50 rounded-full overflow-hidden">
                        <div id="total-progress-bar" class="h-full bg-indigo-300 transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between mt-2 text-sm">
                        <span class="opacity-80">Needs: <span id="total-needs">$0.00</span></span>
                        <span class="font-bold" id="total-allocated">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- ALLOCATION INPUT -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-4 border border-slate-200 dark:border-slate-700">
                <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2">
                    Add New Income
                </label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span>
                        <input id="income-input" type="number" placeholder="0.00" class="w-full pl-7 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-lg font-semibold">
                    </div>
                    <button id="distribute-btn" class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-4 rounded-lg font-medium transition-colors" disabled>
                        Distribute
                    </button>
                </div>
            </div>

            <!-- BILLS LIST -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Active Bills</h3>
                    <button id="show-add-bill-btn" class="text-indigo-600 dark:text-indigo-400 text-sm font-medium flex items-center gap-1 hover:underline">
                        <i class="fa-solid fa-plus"></i> Add Bill
                    </button>
                </div>

                <div id="bills-container" class="space-y-3">
                    <!-- Bills will be injected here -->
                    <div class="text-center py-10 text-slate-400 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
                        <p>Loading bills...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ADD BILL MODAL -->
    <div id="add-bill-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hide">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Add New Bill</h3>
            <form id="add-bill-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Bill Name</label>
                    <input type="text" id="bill-name" required class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-lg p-3" placeholder="e.g. Electric Bill">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Total Amount ($)</label>
                    <input type="number" step="0.01" id="bill-amount" required class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-lg p-3" placeholder="150.00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Due Date</label>
                    <input type="date" id="bill-date" required class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-lg p-3">
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" id="cancel-add-bill" class="flex-1 py-3 text-slate-500 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg">Add Bill</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ALLOCATION PREVIEW MODAL -->
    <div id="allocation-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hide">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                <h3 class="font-bold text-lg">Allocation Plan</h3>
                <p class="text-sm text-slate-500">Review before confirming.</p>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex items-center justify-between bg-green-50 dark:bg-green-900/20 p-3 rounded-lg border border-green-100 dark:border-green-900/30">
                    <span class="text-green-700 dark:text-green-400 font-medium">Total Income</span>
                    <span class="font-bold text-green-700 dark:text-green-400" id="preview-total-income">$0.00</span>
                </div>

                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Distribution</h4>
                    <div id="allocation-list" class="space-y-0">
                        <!-- Items injected here -->
                    </div>
                </div>
            </div>

            <div class="p-4 border-t dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex gap-3">
                <button id="cancel-allocation" class="flex-1 py-3 text-slate-600 font-medium hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">
                    Cancel
                </button>
                <button id="confirm-allocation" class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition-colors flex justify-center items-center gap-2">
                    Confirm & Save <i class="fa-solid fa-circle-check"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc, increment, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBalSGWdrzYB0XH8cw-tcEqT_7uUssjAtY",
            authDomain: "studio-4711143268-e528e.firebaseapp.com",
            projectId: "studio-4711143268-e528e",
            storageBucket: "studio-4711143268-e528e.firebasestorage.app",
            messagingSenderId: "987198081063",
            appId: "1:987198081063:web:25138486f6512d022d6602"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "micro-allocator-v1";

        // --- STATE ---
        let currentUser = null;
        let bills = [];
        let reserve = 0;
        let currentAllocation = null;
        let isLoginMode = true;

        // --- DOM ELEMENTS ---
        const els = {
            loginScreen: document.getElementById('login-screen'),
            mainApp: document.getElementById('main-app'),
            authForm: document.getElementById('auth-form'),
            authEmail: document.getElementById('email'),
            authPass: document.getElementById('password'),
            authSubmitBtn: document.getElementById('auth-submit-btn'),
            authError: document.getElementById('auth-error'),
            toggleAuthMode: document.getElementById('toggle-auth-mode'),
            logoutBtn: document.getElementById('logout-btn'),
            userIdDisplay: document.getElementById('user-id-display'),
            reserveDisplay: document.getElementById('reserve-display'),
            totalProgress: document.getElementById('total-progress-bar'),
            progressText: document.getElementById('progress-text'),
            totalNeeds: document.getElementById('total-needs'),
            totalAllocated: document.getElementById('total-allocated'),
            incomeInput: document.getElementById('income-input'),
            distributeBtn: document.getElementById('distribute-btn'),
            billsContainer: document.getElementById('bills-container'),
            
            // Modals
            addBillModal: document.getElementById('add-bill-modal'),
            showAddBillBtn: document.getElementById('show-add-bill-btn'),
            addBillForm: document.getElementById('add-bill-form'),
            cancelAddBill: document.getElementById('cancel-add-bill'),
            
            allocationModal: document.getElementById('allocation-modal'),
            previewTotalIncome: document.getElementById('preview-total-income'),
            allocationList: document.getElementById('allocation-list'),
            cancelAllocation: document.getElementById('cancel-allocation'),
            confirmAllocation: document.getElementById('confirm-allocation')
        };

        // --- AUTHENTICATION LOGIC ---

        els.toggleAuthMode.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            els.authSubmitBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
            els.toggleAuthMode.innerHTML = isLoginMode 
                ? 'Need an account? <span class="text-indigo-400 font-bold">Create one</span>'
                : 'Already have an account? <span class="text-indigo-400 font-bold">Sign In</span>';
            els.authError.classList.add('hide');
        });

        els.authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = els.authEmail.value;
            const password = els.authPass.value;
            
            els.authSubmitBtn.disabled = true;
            els.authSubmitBtn.textContent = "Processing...";
            els.authError.classList.add('hide');

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                // Auth state listener handles transition
            } catch (error) {
                console.error(error);
                els.authError.textContent = getErrorMessage(error.code);
                els.authError.classList.remove('hide');
                els.authSubmitBtn.disabled = false;
                els.authSubmitBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
            }
        });

        function getErrorMessage(code) {
            switch(code) {
                case 'auth/invalid-email': return 'Invalid email address.';
                case 'auth/user-disabled': return 'User disabled.';
                case 'auth/user-not-found': return 'User not found.';
                case 'auth/wrong-password': return 'Wrong password.';
                case 'auth/email-already-in-use': return 'Email already in use.';
                case 'auth/weak-password': return 'Password is too weak.';
                default: return 'Authentication failed. Please try again.';
            }
        }

        els.logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                els.loginScreen.classList.add('hide');
                els.mainApp.classList.remove('hide');
                els.userIdDisplay.textContent = `${user.email}`;
                initDataListeners();
                
                // Reset Auth Form
                els.authEmail.value = '';
                els.authPass.value = '';
                els.authSubmitBtn.disabled = false;
                els.authSubmitBtn.textContent = 'Sign In';
            } else {
                els.loginScreen.classList.remove('hide');
                els.mainApp.classList.add('hide');
                bills = [];
                reserve = 0;
            }
        });

        // --- FORMATTING HELPERS ---
        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        };

        // --- CORE LOGIC: THE WATERFALL ---
        const calculateAllocation = (incomeAmount, billsList) => {
            let remainingIncome = parseFloat(incomeAmount);
            if (isNaN(remainingIncome) || remainingIncome <= 0) return null;

            const allocationResult = {
                breakdown: [],
                reserve: 0,
                totalAllocated: 0
            };

            const trackAllocation = (billId, amount, stage) => {
                if (amount <= 0.01) return;
                const existing = allocationResult.breakdown.find(b => b.id === billId);
                if (existing) {
                    existing.amount += amount;
                    existing.stages.push(stage);
                } else {
                    const bill = billsList.find(b => b.id === billId);
                    allocationResult.breakdown.push({
                        id: billId,
                        name: bill.name,
                        amount: amount,
                        stages: [stage],
                        current: bill.amountAllocated,
                        total: bill.totalAmount
                    });
                }
                allocationResult.totalAllocated += amount;
            };

            // Deep clone to avoid mutating state
            let tempBills = billsList.map(b => ({
                ...b,
                tempAllocated: b.amountAllocated,
                remainingNeed: b.totalAmount - b.amountAllocated
            }));

            const today = new Date();
            today.setHours(0,0,0,0);

            // Level 1: Urgent
            const urgentBills = tempBills.filter(bill => {
                if (bill.remainingNeed <= 0) return false;
                const dueDate = new Date(bill.dueDate);
                const diffTime = dueDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays <= 3;
            });
            urgentBills.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

            for (let bill of urgentBills) {
                if (remainingIncome <= 0) break;
                const amountToPay = Math.min(remainingIncome, bill.remainingNeed);
                remainingIncome -= amountToPay;
                bill.remainingNeed -= amountToPay;
                trackAllocation(bill.id, amountToPay, 'Urgent');
            }

            // Level 2: Drip
            if (remainingIncome > 0) {
                const drippableBills = tempBills.filter(b => b.remainingNeed > 0);
                if (drippableBills.length > 0) {
                    let totalDailyPressure = 0;
                    const weightedBills = drippableBills.map(bill => {
                        const dueDate = new Date(bill.dueDate);
                        const diffTime = dueDate - today;
                        const daysUntil = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
                        const dailyNeed = bill.remainingNeed / daysUntil;
                        totalDailyPressure += dailyNeed;
                        return { ...bill, weight: dailyNeed };
                    });

                    if (totalDailyPressure > 0) {
                        let incomeForDrip = remainingIncome;
                        weightedBills.forEach(bill => {
                            const share = (bill.weight / totalDailyPressure) * incomeForDrip;
                            const actualAllocation = Math.min(share, bill.remainingNeed);
                            if (actualAllocation > 0) {
                                remainingIncome -= actualAllocation;
                                bill.remainingNeed -= actualAllocation;
                                trackAllocation(bill.id, actualAllocation, 'Drip');
                            }
                        });
                    }
                }
            }

            // Level 3: Reserve
            if (remainingIncome > 0) {
                allocationResult.reserve = remainingIncome;
                allocationResult.totalAllocated += remainingIncome;
            }

            return allocationResult;
        };

        // --- FIRESTORE LISTENERS ---
        let unsubscribeBills = null;
        let unsubscribeReserve = null;

        function initDataListeners() {
            if (!currentUser) return;
            
            // Bills Listener
            const billsRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'bills');
            unsubscribeBills = onSnapshot(billsRef, (snapshot) => {
                bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBills();
                updateDashboard();
            });

            // Reserve Listener
            const reserveRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'meta', 'reserve');
            unsubscribeReserve = onSnapshot(reserveRef, (docSnap) => {
                reserve = docSnap.exists() ? docSnap.data().amount : 0;
                updateDashboard();
            });
        }

        // --- RENDERING ---
        function updateDashboard() {
            els.reserveDisplay.textContent = formatCurrency(reserve);
            
            const totalMonthlyNeed = bills.reduce((acc, b) => acc + b.totalAmount, 0);
            const totalAllocated = bills.reduce((acc, b) => acc + b.amountAllocated, 0);
            const progress = totalMonthlyNeed > 0 ? (totalAllocated / totalMonthlyNeed) * 100 : 0;

            els.totalProgress.style.width = `${progress}%`;
            els.progressText.textContent = `${Math.round(progress)}% Funded`;
            els.totalNeeds.textContent = formatCurrency(totalMonthlyNeed);
            els.totalAllocated.textContent = formatCurrency(totalAllocated);
        }

        function renderBills() {
            els.billsContainer.innerHTML = '';
            
            if (bills.length === 0) {
                els.billsContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
                        <p>No bills set up yet.</p>
                        <p class="text-sm">Tap "Add Bill" to start.</p>
                    </div>`;
                return;
            }

            // Sort by due date
            const sortedBills = [...bills].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
            const today = new Date();

            sortedBills.forEach(bill => {
                const diffTime = new Date(bill.dueDate) - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const isUrgent = diffDays <= 3 && bill.amountAllocated < bill.totalAmount;
                const isFullyFunded = bill.amountAllocated >= bill.totalAmount;
                
                const progress = Math.min(100, Math.max(0, (bill.amountAllocated / bill.totalAmount) * 100));
                
                let statusBadge = '';
                let barColor = 'bg-blue-500';

                if (isFullyFunded) {
                    statusBadge = `<span class="bg-green-100 text-green-600 text-[10px] font-bold px-2 py-0.5 rounded-full">READY</span>`;
                    barColor = 'bg-green-500';
                } else if (isUrgent) {
                    statusBadge = `<span class="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full">DUE SOON</span>`;
                    barColor = 'bg-red-500';
                }

                const el = document.createElement('div');
                el.className = 'bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 relative group';
                el.innerHTML = `
                    <button onclick="window.deleteBill('${bill.id}')" class="absolute top-2 right-2 p-2 opacity-0 group-hover:opacity-100 transition-opacity text-slate-400 hover:text-red-500">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 dark:text-slate-100">${bill.name}</h4>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-1">
                                <i class="fa-regular fa-calendar"></i> Due: ${bill.dueDate}
                            </p>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold">${formatCurrency(bill.amountAllocated)}</div>
                            <div class="text-xs text-slate-400">of ${formatCurrency(bill.totalAmount)}</div>
                        </div>
                    </div>
                    <div class="h-2 w-full progress-bar-bg rounded-full overflow-hidden mt-2">
                        <div class="h-full ${barColor} transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                `;
                els.billsContainer.appendChild(el);
            });
        }

        // --- INTERACTIONS ---
        
        // Income Input
        els.incomeInput.addEventListener('input', (e) => {
            els.distributeBtn.disabled = !e.target.value || parseFloat(e.target.value) <= 0;
        });

        els.distributeBtn.addEventListener('click', () => {
            const amount = parseFloat(els.incomeInput.value);
            if (!amount) return;
            currentAllocation = calculateAllocation(amount, bills);
            renderAllocationPreview();
            els.allocationModal.classList.remove('hide');
        });

        // Add Bill Modal
        els.showAddBillBtn.addEventListener('click', () => els.addBillModal.classList.remove('hide'));
        els.cancelAddBill.addEventListener('click', () => els.addBillModal.classList.add('hide'));
        
        els.addBillForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById('bill-name').value;
            const amount = parseFloat(document.getElementById('bill-amount').value);
            const date = document.getElementById('bill-date').value;

            try {
                await setDoc(doc(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'bills')), {
                    name,
                    totalAmount: amount,
                    amountAllocated: 0,
                    dueDate: date,
                    createdAt: serverTimestamp()
                });
                els.addBillForm.reset();
                els.addBillModal.classList.add('hide');
            } catch (err) {
                console.error(err);
                alert("Error adding bill");
            }
        });

        // Global delete function
        window.deleteBill = async (id) => {
            if(!confirm("Delete this bill? Funds allocated to it will be lost unless you move them manually.")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'bills', id));
            } catch (e) { console.error(e); }
        };

        // Allocation Modal
        function renderAllocationPreview() {
            if (!currentAllocation) return;
            els.previewTotalIncome.textContent = formatCurrency(parseFloat(els.incomeInput.value));
            els.allocationList.innerHTML = '';

            if (currentAllocation.breakdown.length === 0 && currentAllocation.reserve === 0) {
                 els.allocationList.innerHTML = '<p class="text-center text-slate-500 py-4">Amount too small to allocate.</p>';
                 return;
            }

            currentAllocation.breakdown.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center py-2 border-b dark:border-slate-700 last:border-0';
                
                let tags = '';
                if (item.stages.includes('Urgent')) tags += `<span class="text-[10px] bg-red-100 text-red-600 px-1.5 rounded mr-1">Urgent Fill</span>`;
                if (item.stages.includes('Drip')) tags += `<span class="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded">Daily Drip</span>`;

                div.innerHTML = `
                    <div>
                        <div class="font-medium text-sm">${item.name}</div>
                        <div class="flex gap-1 mt-0.5">${tags}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-green-600">+${formatCurrency(item.amount)}</div>
                        <div class="text-xs text-slate-400">New Total: ${formatCurrency(item.current + item.amount)}</div>
                    </div>
                `;
                els.allocationList.appendChild(div);
            });

            if (currentAllocation.reserve > 0) {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center py-2 bg-indigo-50 dark:bg-indigo-900/20 p-2 rounded-lg mt-2';
                div.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-shield-halved text-indigo-600"></i>
                        <span class="font-medium text-sm text-indigo-900 dark:text-indigo-200">To Reserve</span>
                    </div>
                    <div class="font-bold text-indigo-600">+${formatCurrency(currentAllocation.reserve)}</div>
                `;
                els.allocationList.appendChild(div);
            }
        }

        els.cancelAllocation.addEventListener('click', () => els.allocationModal.classList.add('hide'));
        
        els.confirmAllocation.addEventListener('click', async () => {
            if (!currentUser || !currentAllocation) return;
            
            const btn = els.confirmAllocation;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            try {
                await runTransaction(db, async (transaction) => {
                    // Update Bills
                    for (const item of currentAllocation.breakdown) {
                        const billRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'bills', item.id);
                        transaction.update(billRef, { amountAllocated: increment(item.amount) });
                    }
                    // Update Reserve
                    if (currentAllocation.reserve > 0) {
                        const reserveRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'meta', 'reserve');
                        const reserveDoc = await transaction.get(reserveRef);
                        if (reserveDoc.exists()) {
                            transaction.update(reserveRef, { amount: increment(currentAllocation.reserve) });
                        } else {
                            transaction.set(reserveRef, { amount: currentAllocation.reserve });
                        }
                    }
                });

                els.incomeInput.value = '';
                els.distributeBtn.disabled = true;
                els.allocationModal.classList.add('hide');
                currentAllocation = null;
            } catch (error) {
                console.error("Transaction failed: ", error);
                alert("Failed to save allocation.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

    </script>
</body>
</html>
