<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MicroSave Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --app-bg: #09090b; --surface: #18181b; --primary: #3b82f6; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--app-bg); color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
        
        /* Mobile Optimizations */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glass & Surfaces */
        .glass-panel { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .surface-card { background: #18181b; border: 1px solid #27272a; }
        
        /* Inputs */
        .mobile-input { 
            background: #27272a; border: 1px solid transparent; color: white; 
            font-size: 16px; /* Prevents iOS zoom */
            padding: 12px 16px; border-radius: 12px; width: 100%; outline: none; transition: 0.2s;
        }
        .mobile-input:focus { border-color: var(--primary); background: #27272a; }

        /* Animations */
        .slide-up-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Mobile Modal (Bottom Sheet style on mobile, Center on Desktop) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: flex; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            width: 100%; max-width: 500px; background: #18181b; 
            display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
        }
        
        /* Desktop: Center Modal */
        @media (min-width: 768px) {
            .modal-overlay { align-items: center; justify-content: center; padding: 20px; }
            .modal-content { border-radius: 24px; transform: scale(0.95); opacity: 0; border: 1px solid #27272a; max-height: 85vh; }
            .modal-overlay.active .modal-content { transform: scale(1); opacity: 1; }
        }

        /* Mobile: Bottom Sheet */
        @media (max-width: 767px) {
            .modal-overlay { align-items: flex-end; }
            .modal-content { 
                border-radius: 24px 24px 0 0; 
                max-height: 90vh; 
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
            .modal-overlay.active .modal-content { transform: translateY(0); }
        }

        .fab-button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-[60] flex flex-col items-center justify-center p-6 bg-black transition-opacity duration-500">
        <div class="w-full max-w-sm space-y-8 animate-slide-up">
            <div class="text-center">
                <div class="w-20 h-20 bg-blue-500/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-blue-500/20">
                    <svg class="text-blue-500 w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2" /><line x1="12" y1="12" x2="12" y2="12.01" /><line x1="2" y1="10" x2="22" y2="10" /></svg>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">MicroSave</h1>
                <p class="text-zinc-500 mt-2">Smart envelope budgeting.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="auth-error" class="hidden text-xs text-red-400 text-center bg-red-500/10 p-2 rounded-lg"></div>
                <input type="email" id="auth-email" placeholder="Email" class="mobile-input text-center" required>
                <input type="password" id="auth-password" placeholder="Password" class="mobile-input text-center" required>
                <button type="submit" id="auth-btn" class="w-full py-4 bg-white text-black font-bold rounded-xl active:scale-95 transition-transform">
                    Sign In
                </button>
            </form>

            <button id="toggle-auth" type="button" class="w-full text-zinc-500 text-sm py-2">Create an account instead</button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-screen" class="hidden w-full h-full flex flex-col relative">
        
        <!-- HEADER -->
        <header class="flex-none px-6 pt-12 pb-4 bg-gradient-to-b from-black to-transparent z-10">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-sm text-zinc-400 font-medium">Total Saved</h2>
                    <div class="text-4xl font-bold text-white tracking-tight mt-1" id="header-total">$0.00</div>
                </div>
                <button onclick="signOutApp()" class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:bg-zinc-700">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                <div id="header-progress" class="bg-blue-500 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-xs text-zinc-500 font-medium">
                <span>Monthly Progress</span>
                <span id="header-percent">0%</span>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT -->
        <main class="flex-1 overflow-y-auto hide-scrollbar px-4 pb-32" id="main-scroll">
            
            <!-- Filter Pills -->
            <div class="flex gap-2 mb-6 overflow-x-auto hide-scrollbar pb-2">
                <button onclick="filterBills('all')" class="filter-btn active px-4 py-2 rounded-full bg-white text-black text-sm font-semibold transition-colors">All</button>
                <button onclick="filterBills('urgent')" class="filter-btn px-4 py-2 rounded-full bg-zinc-800 text-zinc-400 text-sm font-medium border border-zinc-700">Urgent</button>
                <button onclick="filterBills('ready')" class="filter-btn px-4 py-2 rounded-full bg-zinc-800 text-zinc-400 text-sm font-medium border border-zinc-700">Ready</button>
            </div>

            <!-- Grid -->
            <div id="envelopes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Cards injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-zinc-600">
                <div class="w-16 h-16 bg-zinc-900 rounded-full flex items-center justify-center mb-4">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <p>No envelopes yet</p>
                <p class="text-sm">Tap + to add one</p>
            </div>

            <div class="h-8"></div> <!-- Spacer -->
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="flex-none bg-black/80 backdrop-blur-xl border-t border-white/5 pb-[env(safe-area-inset-bottom)] z-40 fixed bottom-0 w-full md:relative md:hidden">
            <div class="flex justify-around items-center h-16 px-2">
                <button class="flex flex-col items-center gap-1 p-2 text-blue-500">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                
                <!-- FAB Wrapper -->
                <div class="relative -top-6">
                    <button onclick="toggleFabMenu()" class="fab-button w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl active:scale-95 transition-transform">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>

                <button onclick="showHistory()" class="flex flex-col items-center gap-1 p-2 text-zinc-500 hover:text-white transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="text-[10px] font-medium">History</span>
                </button>
            </div>
        </nav>

        <!-- DESKTOP NAV FAB EQUIVALENT (Hidden on mobile) -->
        <div class="hidden md:block fixed bottom-8 right-8 z-50">
            <button onclick="toggleFabMenu()" class="fab-button w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl hover:scale-105 transition-transform">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>

    </div>

    <!-- ACTION MENU (BottomSheet Overlay) -->
    <div id="fab-menu" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex-col justify-end p-6 pb-24 md:justify-center md:pb-6 animate-fade-in" onclick="toggleFabMenu()">
        <div class="flex flex-col gap-3 max-w-sm mx-auto w-full">
            <button onclick="openModal('bill-modal')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-4 rounded-xl flex items-center gap-4 border border-zinc-700 shadow-xl transform translate-y-4 transition-transform duration-200">
                <div class="w-10 h-10 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="11" y2="17"/><line x1="9" x2="15" y1="14" y2="14"/></svg>
                </div>
                <div class="text-left">
                    <div class="font-bold">Add Envelope</div>
                    <div class="text-xs text-zinc-400">Create a new bill tracker</div>
                </div>
            </button>
            <button onclick="openModal('deposit-modal')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-4 rounded-xl flex items-center gap-4 border border-zinc-700 shadow-xl transform translate-y-2 transition-transform duration-200 delay-75">
                <div class="w-10 h-10 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="1" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="text-left">
                    <div class="font-bold">Deposit Paycheck</div>
                    <div class="text-xs text-zinc-400">Distribute funds</div>
                </div>
            </button>
        </div>
    </div>

    <!-- BILL MODAL -->
    <div id="bill-modal" class="modal-overlay">
        <div class="modal-content flex flex-col h-auto">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white" id="bill-modal-title">New Envelope</h3>
                <button onclick="closeModal('bill-modal')" class="p-2 text-zinc-500 hover:text-white bg-zinc-800 rounded-full"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            
            <form id="bill-form" class="p-6 space-y-5 overflow-y-auto">
                <input type="hidden" id="bill-id">
                <div>
                    <label class="text-xs font-semibold text-zinc-500 uppercase ml-1">Name</label>
                    <input type="text" id="bill-name" class="mobile-input" placeholder="e.g. Rent" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-zinc-500 uppercase ml-1">Monthly Cost</label>
                        <input type="number" id="bill-amount" step="0.01" class="mobile-input" placeholder="$0.00" required>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-zinc-500 uppercase ml-1">Due Date</label>
                        <input type="date" id="bill-date" class="mobile-input" required>
                    </div>
                </div>

                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                    <label class="flex items-center gap-3">
                        <input type="checkbox" id="bill-has-balance" class="w-5 h-5 rounded bg-zinc-700 border-zinc-600 text-blue-500 focus:ring-blue-600">
                        <span class="text-sm font-medium text-zinc-300">Existing Balance?</span>
                    </label>
                    <div id="balance-input-container" class="hidden mt-4">
                        <label class="text-xs font-semibold text-zinc-500 uppercase ml-1">Current Saved</label>
                        <input type="number" id="bill-current-saved" step="0.01" class="mobile-input" placeholder="$0.00">
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" id="delete-bill-btn" class="hidden px-4 py-3 bg-red-500/10 text-red-400 rounded-xl font-medium">Delete</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-900/20 active:scale-95 transition-transform">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DEPOSIT MODAL -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content flex flex-col h-[90vh] md:h-auto">
            <div class="p-6 border-b border-white/5 bg-zinc-900 z-10 sticky top-0">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white">Deposit</h3>
                    <button onclick="closeModal('deposit-modal')" class="p-2 text-zinc-500 hover:text-white bg-zinc-800 rounded-full"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                </div>
                
                <div class="bg-zinc-800 p-2 rounded-xl flex gap-2 border border-zinc-700">
                    <div class="flex-1 relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-green-500 font-bold">$</span>
                        <input type="number" id="deposit-amount" class="w-full bg-transparent text-white font-bold pl-7 pr-2 py-2 outline-none" placeholder="0.00">
                    </div>
                    <select id="deposit-freq" class="bg-zinc-700 text-white text-xs rounded-lg px-2 outline-none border-l border-zinc-600">
                        <option value="1">Weekly</option>
                        <option value="2">Bi-Weekly</option>
                        <option value="4">Monthly</option>
                    </select>
                </div>
                <div class="flex justify-between items-center mt-3">
                    <button onclick="autoDistribute()" class="text-xs font-bold text-blue-400 bg-blue-500/10 px-3 py-1.5 rounded-lg border border-blue-500/20">Auto-Fill</button>
                    <div class="text-xs text-zinc-400">Remaining: <span id="deposit-remaining" class="text-white font-mono">$0.00</span></div>
                </div>
            </div>

            <div id="deposit-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-black/20">
                <!-- JS Injected -->
            </div>

            <div class="p-4 border-t border-white/5 bg-zinc-900 pb-[calc(20px+env(safe-area-inset-bottom))]">
                <button onclick="submitDeposit()" id="submit-deposit-btn" class="w-full py-4 bg-green-600 text-white font-bold rounded-xl shadow-lg shadow-green-900/20 active:scale-95 transition-transform disabled:opacity-50">
                    Confirm Deposit
                </button>
            </div>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content h-[60vh]">
             <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">Recent Deposits</h3>
                <button onclick="closeModal('history-modal')" class="p-2 text-zinc-500 hover:text-white bg-zinc-800 rounded-full"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div id="history-list" class="p-4 space-y-2 overflow-y-auto"></div>
        </div>
    </div>

    <!-- JS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, limit, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBalSGWdrzYB0XH8cw-tcEqT_7uUssjAtY",
            authDomain: "studio-4711143268-e528e.firebaseapp.com",
            projectId: "studio-4711143268-e528e",
            storageBucket: "studio-4711143268-e528e.firebasestorage.app",
            messagingSenderId: "987198081063",
            appId: "1:987198081063:web:25138486f6512d022d6602"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let currentUser = null;
        let bills = [];
        let currentFilter = 'all';

        // --- AUTH ---
        const initAuth = async () => {
             if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch(e) { console.log("Custom token failed", e); }
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');
            
            if (user) {
                authScreen.style.opacity = '0';
                setTimeout(() => authScreen.classList.add('hidden'), 500);
                appScreen.classList.remove('hidden');
                setupListeners(user.uid);
            } else {
                authScreen.classList.remove('hidden');
                setTimeout(() => authScreen.style.opacity = '1', 10);
                appScreen.classList.add('hidden');
            }
        });

        // --- FORM HANDLERS ---
        document.getElementById('toggle-auth').addEventListener('click', (e) => {
            const btn = document.getElementById('auth-btn');
            const isLogin = btn.innerText === 'Sign In';
            btn.innerText = isLogin ? 'Create Account' : 'Sign In';
            e.target.innerText = isLogin ? 'Already have an account? Sign In' : 'Create an account instead';
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-btn');
            const err = document.getElementById('auth-error');

            btn.innerText = 'Please wait...';
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                if (btn.innerText.includes('Create')) await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                err.innerText = error.message.replace('Firebase: ', '');
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = document.getElementById('toggle-auth').innerText.includes('Sign In') ? 'Create Account' : 'Sign In';
            }
        });

        window.signOutApp = () => signOut(auth);

        // --- CORE LOGIC ---
        function setupListeners(uid) {
            // Bills
            const q = query(collection(db, 'artifacts', appId, 'users', uid, 'bills'), orderBy('dueDate', 'asc'));
            onSnapshot(q, (snapshot) => {
                bills = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderBills();
                updateStats();
            });

            // History
            const histQ = query(collection(db, 'artifacts', appId, 'users', uid, 'transactions'), orderBy('date', 'desc'), limit(10));
            onSnapshot(histQ, (snapshot) => {
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                if(snapshot.empty) list.innerHTML = '<div class="text-zinc-500 text-center py-4">No recent deposits</div>';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const item = document.createElement('div');
                    item.className = 'flex justify-between p-3 bg-zinc-800 rounded-lg border border-zinc-700';
                    item.innerHTML = `
                        <span class="text-zinc-400 text-sm">${d.date ? new Date(d.date.seconds*1000).toLocaleDateString() : 'Now'}</span>
                        <span class="text-green-400 font-bold font-mono">+$${d.total.toFixed(2)}</span>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function renderBills() {
            const grid = document.getElementById('envelopes-grid');
            grid.innerHTML = '';
            
            // Filter logic
            let displayBills = bills;
            if (currentFilter === 'urgent') displayBills = bills.filter(b => getDaysUntil(b.dueDate) <= 7 && b.saved < b.cost);
            if (currentFilter === 'ready') displayBills = bills.filter(b => b.saved >= b.cost);

            if (displayBills.length === 0 && bills.length > 0) {
                 grid.innerHTML = '<div class="col-span-full text-center py-10 text-zinc-600">No envelopes match this filter</div>';
                 return;
            }
            if (bills.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');

            displayBills.forEach(bill => {
                const percent = Math.min(100, Math.max(0, (bill.saved / bill.cost) * 100));
                const isFull = bill.saved >= bill.cost;
                const daysLeft = getDaysUntil(bill.dueDate);
                
                let accent = "border-zinc-800";
                let barColor = "bg-zinc-600";
                let statusText = `${daysLeft} days left`;
                let statusClass = "text-zinc-500";

                if (isFull) {
                    accent = "border-green-500/30 bg-green-900/10";
                    barColor = "bg-green-500";
                    statusText = "Ready to Pay";
                    statusClass = "text-green-400 font-bold";
                } else if (daysLeft < 0) {
                    accent = "border-red-500/30 bg-red-900/10";
                    barColor = "bg-red-500";
                    statusText = "Overdue";
                    statusClass = "text-red-400 font-bold";
                } else if (daysLeft <= 7) {
                    barColor = "bg-orange-500";
                }

                const el = document.createElement('div');
                el.className = `p-4 rounded-2xl surface-card ${accent} transition-transform active:scale-[0.98]`;
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="font-bold text-lg text-white">${bill.name}</div>
                            <div class="text-xs ${statusClass}">${statusText}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-lg font-bold text-white">$${bill.saved.toFixed(0)}</div>
                            <div class="text-xs text-zinc-500">of $${bill.cost.toFixed(0)}</div>
                        </div>
                    </div>
                    
                    <div class="h-2 w-full bg-zinc-800 rounded-full overflow-hidden mb-4">
                        <div class="h-full ${barColor} transition-all duration-500" style="width: ${percent}%"></div>
                    </div>

                    <div class="flex gap-2">
                        ${isFull ? `
                        <button onclick="payBill('${bill.id}')" class="flex-1 py-2.5 bg-green-600 text-white text-sm font-bold rounded-xl shadow-lg shadow-green-900/20">Pay Bill</button>
                        ` : `
                        <button onclick="quickAdd('${bill.id}')" class="flex-1 py-2.5 bg-zinc-800 text-blue-400 text-sm font-medium rounded-xl border border-zinc-700">Add Funds</button>
                        `}
                        <button onclick="editBill('${bill.id}')" class="w-10 flex items-center justify-center bg-zinc-800 rounded-xl border border-zinc-700 text-zinc-400">
                             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                        </button>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        // --- ACTIONS ---
        window.toggleFabMenu = () => {
            const menu = document.getElementById('fab-menu');
            if(menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        };

        window.filterBills = (type) => {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-black');
                b.classList.add('bg-zinc-800', 'text-zinc-400');
            });
            event.target.classList.remove('bg-zinc-800', 'text-zinc-400');
            event.target.classList.add('bg-white', 'text-black');
            renderBills();
        };

        window.payBill = async (id) => {
            const bill = bills.find(b => b.id === id);
            if(!bill) return;
            const remainder = bill.saved - bill.cost;
            const nextDate = new Date(bill.dueDate);
            nextDate.setMonth(nextDate.getMonth() + 1);

            if(confirm(`Pay ${bill.name}? $${remainder.toFixed(2)} will rollover.`)) {
                await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bills', id), {
                    saved: remainder,
                    dueDate: nextDate.toISOString().split('T')[0]
                });
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        };

        window.quickAdd = async (id) => {
            const amt = prompt("Amount to add:");
            if(amt && !isNaN(amt)) {
                const bill = bills.find(b => b.id === id);
                await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bills', id), {
                    saved: bill.saved + parseFloat(amt)
                });
            }
        };

        // --- BILL MODAL LOGIC ---
        document.getElementById('bill-has-balance').addEventListener('change', (e) => {
            const div = document.getElementById('balance-input-container');
            if(e.target.checked) div.classList.remove('hidden'); else div.classList.add('hidden');
        });

        document.getElementById('bill-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('bill-id').value;
            const data = {
                name: document.getElementById('bill-name').value,
                cost: parseFloat(document.getElementById('bill-amount').value),
                dueDate: document.getElementById('bill-date').value,
                saved: document.getElementById('bill-has-balance').checked ? parseFloat(document.getElementById('bill-current-saved').value) : (id ? undefined : 0) // Keep saved if undefined
            };
            
            // If editing and didn't check balance, remove 'saved' from update to prevent overwrite
            if(id && !document.getElementById('bill-has-balance').checked) delete data.saved;

            if(id) await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bills', id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'bills'), data);
            
            closeModal('bill-modal');
        });
        
        document.getElementById('delete-bill-btn').addEventListener('click', async () => {
             const id = document.getElementById('bill-id').value;
             if(confirm("Delete this envelope?")) {
                 await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bills', id));
                 closeModal('bill-modal');
             }
        });

        window.editBill = (id) => {
            const bill = bills.find(b => b.id === id);
            document.getElementById('bill-id').value = id;
            document.getElementById('bill-name').value = bill.name;
            document.getElementById('bill-amount').value = bill.cost;
            document.getElementById('bill-date').value = bill.dueDate;
            document.getElementById('bill-modal-title').innerText = "Edit Envelope";
            document.getElementById('delete-bill-btn').classList.remove('hidden');
            openModal('bill-modal');
        };

        // --- DEPOSIT LOGIC ---
        window.autoDistribute = () => {
            const amount = parseFloat(document.getElementById('deposit-amount').value) || 0;
            const freq = parseInt(document.getElementById('deposit-freq').value) || 4;
            document.querySelectorAll('.deposit-input').forEach(inp => {
                const cost = parseFloat(inp.dataset.cost);
                const saved = parseFloat(inp.dataset.saved);
                let val = cost / (4 / freq);
                const needed = cost - saved;
                if(val > needed) val = needed;
                if(val < 0) val = 0;
                inp.value = val.toFixed(2);
            });
            updateDepositRemaining();
        };

        window.updateDepositRemaining = () => {
            const total = parseFloat(document.getElementById('deposit-amount').value) || 0;
            let allocated = 0;
            document.querySelectorAll('.deposit-input').forEach(i => allocated += (parseFloat(i.value) || 0));
            const rem = total - allocated;
            const el = document.getElementById('deposit-remaining');
            const btn = document.getElementById('submit-deposit-btn');
            
            el.innerText = '$' + rem.toFixed(2);
            if(rem < 0) { el.classList.add('text-red-400'); el.classList.remove('text-white'); btn.disabled = true; btn.innerText = "Over Budget"; }
            else { el.classList.remove('text-red-400'); el.classList.add('text-white'); btn.disabled = false; btn.innerText = "Confirm Deposit"; }
        };

        window.submitDeposit = async () => {
            const btn = document.getElementById('submit-deposit-btn');
            btn.disabled = true; btn.innerText = 'Processing...';
            const batch = writeBatch(db);
            let totalAdded = 0;
            
            document.querySelectorAll('.deposit-input').forEach(inp => {
                const add = parseFloat(inp.value) || 0;
                if(add > 0) {
                    totalAdded += add;
                    const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bills', inp.dataset.id);
                    batch.update(ref, { saved: parseFloat(inp.dataset.saved) + add });
                }
            });

            if(totalAdded > 0) {
                const transRef = doc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions'));
                batch.set(transRef, { total: totalAdded, date: serverTimestamp() });
                await batch.commit();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
            closeModal('deposit-modal');
        };

        // --- UTILS ---
        window.openModal = (id) => {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            
            if(id === 'bill-modal') {
                 if(document.getElementById('bill-modal-title').innerText !== "Edit Envelope") {
                    document.getElementById('bill-form').reset();
                    document.getElementById('bill-id').value = '';
                    document.getElementById('delete-bill-btn').classList.add('hidden');
                    document.getElementById('balance-input-container').classList.add('hidden');
                 }
            }

            if(id === 'deposit-modal') {
                const list = document.getElementById('deposit-list');
                list.innerHTML = '';
                document.getElementById('deposit-amount').value = '';
                document.getElementById('deposit-remaining').innerText = '$0.00';
                
                // Sort by Need (Highest % needed first)
                const sorted = [...bills].sort((a,b) => (b.cost - b.saved) - (a.cost - a.saved));
                
                sorted.forEach(b => {
                    const row = document.createElement('div');
                    row.className = "flex items-center gap-3 bg-zinc-800 p-3 rounded-xl border border-zinc-700";
                    row.innerHTML = `
                        <div class="flex-1">
                            <div class="text-sm font-bold text-white">${b.name}</div>
                            <div class="text-xs text-zinc-500">Saved: $${b.saved.toFixed(0)} / $${b.cost.toFixed(0)}</div>
                        </div>
                        <input type="number" step="0.01" class="deposit-input w-24 bg-black text-white p-2 rounded-lg text-right outline-none focus:ring-1 ring-blue-500" placeholder="0.00" data-id="${b.id}" data-cost="${b.cost}" data-saved="${b.saved}">
                    `;
                    list.appendChild(row);
                });
                
                document.getElementById('deposit-amount').addEventListener('input', updateDepositRemaining);
                document.querySelectorAll('.deposit-input').forEach(i => i.addEventListener('input', updateDepositRemaining));
            }
            
            // Hide FAB menu if open
            document.getElementById('fab-menu').classList.add('hidden');
            document.getElementById('fab-menu').classList.remove('flex');
        };

        window.closeModal = (id) => {
            document.getElementById(id).classList.remove('active');
            // Reset modal titles after animation
            setTimeout(() => {
                if(id === 'bill-modal') document.getElementById('bill-modal-title').innerText = "New Envelope";
            }, 300);
        };
        
        window.showHistory = () => openModal('history-modal');

        function updateStats() {
            const saved = bills.reduce((a,b) => a + b.saved, 0);
            const cost = bills.reduce((a,b) => a + b.cost, 0);
            const pct = cost > 0 ? (saved / cost) * 100 : 0;
            document.getElementById('header-total').innerText = '$' + saved.toFixed(2);
            document.getElementById('header-progress').style.width = Math.min(100, pct) + '%';
            document.getElementById('header-percent').innerText = pct.toFixed(0) + '% Funded';
        }

        function getDaysUntil(d) {
            return Math.ceil((new Date(d) - new Date().setHours(0,0,0,0)) / (86400000));
        }

    </script>
</body>
</html>
